services:
  # 1. Backend Service (NestJS)
  - type: web
    name: intranet-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run build --filter=api...
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: intranet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

  # 2. Frontend Service (Next.js)
  - type: web
    name: intranet-web
    env: node
    plan: free
    buildCommand: npm install && npx turbo run build --filter=web
    startCommand: npm start --prefix apps/web
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: intranet-api
          property: hostport
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

databases:
  # 3. Database (PostgreSQL)
  - name: intranet-db
    plan: free
    databaseName: intranet
    user: admin
